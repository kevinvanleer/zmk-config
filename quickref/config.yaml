  raw_binding_map:
    '&left_pinky_hold LCTL': {t: Ctrl, type: ctrl}
    '&right_pinky_hold LCTL': {t: Ctrl, type: ctrl}
    '&left_ringy_hold LALT': {t: Alt, type: alt}
    '&right_ringy_hold LALT': {t: Alt, type: alt}
    '&left_middy_hold LGUI': {t: Cmd, type: cmd}
    '&right_middy_hold LGUI': {t: Cmd, type: cmd}
    '&left_index_hold LSFT': {t: Shift, type: shift}
    '&right_index_hold LSFT': {t: Shift, type: shift}
    '&left_pinky_tap': {t: tap, type: trans}
    '&left_ringy_tap': {t: tap, type: trans}
    '&left_middy_tap': {t: tap, type: trans}
    '&left_index_tap': {t: tap, type: trans}
    '&right_pinky_tap': {t: tap, type: trans}
    '&right_ringy_tap': {t: tap, type: trans}
    '&right_middy_tap': {t: tap, type: trans}
    '&right_index_tap': {t: tap, type: trans}
    '&select_word_right': Sel word →
    '&select_word_left': Sel word ←
    '&select_line_right': Sel line →
    '&select_line_left': Sel line ←
    '&mod_tab_chord LGUI 16': ⌘Tab
    '&mod_tab_chord LALT 16': ⌥Tab
    '&mod_tab_chord LCTL 16': ⌃Tab
