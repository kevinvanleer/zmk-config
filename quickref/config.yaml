draw_config:
  key_w: 60.0
  key_h: 56.0
  append_colon_to_layer_header: false
  shrink_wide_legends: 6
  svg_extra_style: |
    svg.keymap { font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 13px; }
    rect.key { fill: #fdfdfd; stroke: #b8b8b8; }
    rect.held { fill: #fdd; }
    text.hold { fill: #555; font-style: italic; }
    text.label { font-size: 20px; }
    rect.key.shift { fill: #fff6c4; }
    rect.key.ctrl { fill: #e4f7d4; }
    rect.key.alt { fill: #d9f1fb; }
    rect.key.cmd { fill: #fde3e8; }
    rect.key.layer { fill: #efe6fb; }
    rect.key.sticky { fill: #fde9d6; }
    rect.combo { fill: #e8f0fe; }
parse_config:
  sticky_label: sticky
  trans_legend: {t: ▽, type: trans}
  modifier_fn_map:
    left_ctrl: ⌃
    right_ctrl: ⌃
    left_shift: ⇧
    right_shift: ⇧
    left_alt: ⌥
    right_alt: ⌥
    left_gui: ⌘
    right_gui: ⌘
    keycode_combiner: '{mods}{key}'
    mod_combiner: '{mod_1}{mod_2}'
    special_combinations:
      left_ctrl+left_alt+left_gui+left_shift: Hyper
      left_ctrl+left_alt+left_shift: Meh
  zmk_keycode_map:
    EXCLAMATION: '!'
    EXCL: '!'
    AT_SIGN: '@'
    AT: '@'
    HASH: '#'
    POUND: '#'
    DOLLAR: $
    DLLR: $
    PERCENT: '%'
    PRCNT: '%'
    CARET: ^
    AMPERSAND: '&'
    AMPS: '&'
    ASTERISK: '*'
    ASTRK: '*'
    STAR: '*'
    LEFT_PARENTHESIS: (
    LPAR: (
    RIGHT_PARENTHESIS: )
    RPAR: )
    PLUS: +
    UNDERSCORE: _
    UNDER: _
    QUESTION: '?'
    QMARK: '?'
    PIPE: '|'
    PIPE2: '|'
    COLON: ':'
    DOUBLE_QUOTES: '"'
    DQT: '"'
    LESS_THAN: <
    LT: <
    GREATER_THAN: '>'
    GT: '>'
    LEFT_BRACE: '{'
    LBRC: '{'
    RIGHT_BRACE: '}'
    RBRC: '}'
    TILDE: '~'
    TILDE2: '~'
    NON_US_HASH: '#'
    NUHS: '#'
    NON_US_BACKSLASH: \
    NON_US_BSLH: '|'
    N1: {t: '1', s: '!'}
    N2: {t: '2', s: '@'}
    N3: {t: '3', s: '#'}
    N4: {t: '4', s: $}
    N5: {t: '5', s: '%'}
    N6: {t: '6', s: ^}
    N7: {t: '7', s: '&'}
    N8: {t: '8', s: '*'}
    N9: {t: '9', s: (}
    N0: {t: '0', s: )}
    NUMBER_1: {t: '1', s: '!'}
    NUMBER_2: {t: '2', s: '@'}
    NUMBER_3: {t: '3', s: '#'}
    NUMBER_4: {t: '4', s: $}
    NUMBER_5: {t: '5', s: '%'}
    NUMBER_6: {t: '6', s: ^}
    NUMBER_7: {t: '7', s: '&'}
    NUMBER_8: {t: '8', s: '*'}
